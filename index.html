<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朝食チェックリスト</title>

  <link rel="stylesheet" href="style.css">
</head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="朝食チェック">
<body>

<div class="container">

    <h1>朝食チェックリスト</h1>
  
<div class="tabs">
  <button class="tab-button active" data-category="準備">準備</button>
 <button class="tab-button" data-category="発注">カート</button>
  <button class="tab-button" data-category="補充">補充</button>
</div>
    <div class="progress">
    <span id="progress">0 / 0 完了</span>
</div>

<button id="resetButton" class="reset-button">
    全てのチェックを解除
</button>

<div id="checklist"></div>

<button id="addItemButton" class="add-button">
    ＋ チェック項目を追加
</button>

</div>

<script type="module" src="app.js?v=2"></script>

</body>
</html>
